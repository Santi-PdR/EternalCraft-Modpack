name: Build / Release Eternal Craft Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            artifact: linux
          - os: windows-latest
            target: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher release tag
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        run: node scripts/verify-launcher-release.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run visuals:fetch
      - run: npm run check
      - run: npm test
      - name: Verify app assets
        shell: bash
        run: |
          test -f resources/icons/icon.png
          test -f resources/icons/icon.ico
          test -f resources/default-config.json
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-craft-launcher-${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Verify updater metadata
        shell: bash
        run: |
          cd release-files
          if compgen -G '*AppImage' > /dev/null; then test -s latest-linux.yml; fi
          if compgen -G '*Setup*.exe' > /dev/null || compgen -G '*Portable*.exe' > /dev/null; then test -s latest.yml; fi
      - name: Generate checksums
        shell: bash
        run: |
          cd release-files
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release-files/*
      - name: Publish stable launcher updater feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --latest --repo "$GITHUB_REPOSITORY"
          if ! gh release view launcher-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create launcher-latest --latest=false --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Eternal Craft Launcher · canal estable" --notes "Canal estable de actualización automática del launcher."
          fi
          mapfile -t updater_assets < <(find release-files -maxdepth 1 -type f \( -name 'latest*.yml' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.blockmap' \) -print | sort)
          test "${#updater_assets[@]}" -gt 0
          gh release upload launcher-latest "${updater_assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
