name: Build / Release Eternal Craft Launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: dist:linux
            artifact: linux
          - os: windows-latest
            target: dist:win
            artifact: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run visuals:fetch
      - run: npm run check
      - name: Verify app assets
        shell: bash
        run: |
          test -f resources/icons/icon.png
          test -f resources/icons/icon.ico
          test -f resources/default-config.json
      - run: npm run ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: eternal-craft-launcher-${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          cd release-files
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
