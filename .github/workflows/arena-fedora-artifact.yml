name: Arena Fedora AppImage build

on:
  push:
    branches:
      - arena/01a0ff07-eternalcraft-modpack

permissions:
  contents: read

jobs:
  build-linux-appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run dist:linux
      - name: Validate and smoke-test Fedora AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          test -s "$appimage"
          test -x "$appimage"
          file "$appimage"
          sha256sum "$appimage"
          mkdir -p /tmp/eternalcraft-appimage-smoke
          cd /tmp/eternalcraft-appimage-smoke
          "$GITHUB_WORKSPACE/$appimage" --appimage-extract
          test -x squashfs-root/AppRun
          test -s squashfs-root/resources/app.asar
          test -x squashfs-root/EternalCraftLauncher
          set +e
          timeout --signal=TERM --kill-after=5s 20s xvfb-run -a squashfs-root/EternalCraftLauncher \
            --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-software-rasterizer
          smoke_status=$?
          set -e
          if [ "$smoke_status" -ne 124 ] && [ "$smoke_status" -ne 0 ]; then
            echo "Headless launch failed with status $smoke_status" >&2
            exit "$smoke_status"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Eternal-Craft-Launcher-Fedora-x64-v0.80.0
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 30
